name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./framework-pruebas-sql
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check pip packages
      run: python -m pip check
      
    - name: Check JS syntax
      run: find frontend -name "*.js" -exec node --check {} +
    - name: Prepare temporary SQLite DB
      run: |
        export FRAMEWORK_DB_URL=sqlite:///./temp_test_db.sqlite
        alembic upgrade head
        
    - name: Run normal tests (1st pass)
      run: pytest -q -m "not oracle_integration"
      
    - name: Run normal tests (2nd pass)
      run: pytest -q -m "not oracle_integration"
      
    - name: Test Docker build
      run: docker build -t sql-qa-framework:latest .
