name: Docs Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./framework-pruebas-sql
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify mandatory documents exist
      run: |
        test -f README.md
        test -f infra/production/README.md
        test -f docs/manual-usuario.md
        test -f docs/manual-tecnico.md
        test -f docs/arquitectura.md
        test -f docs/instalacion-local.md
        test -f docs/despliegue.md
        
    - name: Verify diagrams exist
      run: |
        test -f docs/diagramas/actividad.mermaid
        test -f docs/diagramas/arquitectura.mermaid
        test -f docs/diagramas/base_datos.mermaid
        test -f docs/diagramas/casos_uso.mermaid
        test -f docs/diagramas/clases.mermaid
        test -f docs/diagramas/componentes.mermaid
        test -f docs/diagramas/despliegue.mermaid
        test -f docs/diagramas/paquetes.mermaid
        test -f docs/diagramas/secuencia.mermaid
        
    - name: Verify no secrets in examples
      run: |
        python scripts/build_clean_zip.py
