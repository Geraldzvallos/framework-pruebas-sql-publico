name: framework_pruebas_sql
services:
  caddy:
    image: caddy:2-alpine
    container_name: framework_caddy_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    command: caddy reverse-proxy --from ${APP_DOMAIN:-localhost} --to api:8000
    networks:
      - framework_net
    depends_on:
      api:
        condition: service_healthy

  api:
    image: sql-qa-framework:latest
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: framework_api_prod
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - FRAMEWORK_DB_URL=sqlite:////data/framework_interno.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set}
      - APP_ACCESS_ENABLED=${APP_ACCESS_ENABLED:-true}
      - APP_ACCESS_USERNAME=${APP_ACCESS_USERNAME:?APP_ACCESS_USERNAME must be set}
      - APP_ACCESS_PASSWORD=${APP_ACCESS_PASSWORD:?APP_ACCESS_PASSWORD must be set}
      - APP_SESSION_SECRET=${APP_SESSION_SECRET:?APP_SESSION_SECRET must be set}
      - MAX_RESULT_ROWS=${MAX_RESULT_ROWS:-1000}
      - ORACLE_CALL_TIMEOUT_MS=${ORACLE_CALL_TIMEOUT_MS:-10000}
      - RUN_ORACLE_TESTS=${RUN_ORACLE_TESTS:-0}
    volumes:
      - framework_data:/data
    networks:
      - framework_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  oracle_db:
    image: container-registry.oracle.com/database/free@sha256:f988b0c04c4c386cd306a2a914c0d7a9702d83acc31b064a28ad8eb6278a8fba
    container_name: framework_oracle_prod
    restart: unless-stopped
    environment:
      - ORACLE_PWD=${ORACLE_PWD:?ORACLE_PWD must be set}
      - FRAMEWORK_TEST_PASSWORD=${FRAMEWORK_TEST_PASSWORD:?FRAMEWORK_TEST_PASSWORD must be set}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ../oracle/init:/opt/oracle/scripts/startup:ro
    networks:
      - framework_net
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  framework_data:
  oracle_data:

networks:
  framework_net:
    driver: bridge
