services:
  oracle_db:
    image: container-registry.oracle.com/database/free:latest
    container_name: framework_oracle_db
    env_file:
      - ../../.env.oracle
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./init:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    restart: unless-stopped

volumes:
  oracle_data:
